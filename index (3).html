<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <input type="number" id="attended" placeholder="Classes Attended">
        <input type="number" id="total" placeholder="Total Classes">

        <button onclick="calculateAttendance()">Calculate</button>

        <p id="result"></p>
       <script>
          function calculateAttendance() {
                    let attended = Number(document.getElementById("attended").value);
                                let total = Number(document.getElementById("total").value);

                                                if (total === 0) {
                                                                        document.getElementById("result").innerHTML = "Invalid total classes";
                                                                                                        return;
                                                                                                                                            }

                                                                                                                                                                                    let percentage = (attended / total) * 100;

                                                                                                                                                                                                                                document.getElementById("result").innerHTML =
                                                                                                                                                                                                                                                                                    "Attendance Percentage: " + percentage.toFixed(2) + "%";
                                                                                                                                                                                                                                                                                                                                        }
       </script>
    </body>
</html>
